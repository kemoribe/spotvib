[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotvib"
version = "0.2.0"
description = "Track a colored reflection spot and analyze its motion from video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "opencv-python-headless", "scipy", "matplotlib"]

[project.scripts]
spotvib = "spotvib.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
